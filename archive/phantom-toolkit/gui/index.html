<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2Pz's Phantom Toolkit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #0c0c0c;
      color: #d1d1d1;
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    .fantasy-font {
      font-family: 'Cinzel', serif;
    }

    .inter-font {
      font-family: 'Inter', sans-serif;
    }

    .textured-bg {
      background-color: #0c0c0c;
      background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0c0c0c 100%);
    }

    .soulslike-slot {
      background: rgba(40, 40, 40, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .soulslike-slot:hover {
      background: rgba(60, 60, 60, 0.5);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .soulslike-slot.active {
      background: rgba(80, 80, 80, 0.4);
      border-color: rgba(191, 165, 113, 0.3);
    }

    .item-glow::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(200, 180, 120, 0.3) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .selected-highlight {
      outline: 2px solid rgba(191, 165, 113, 0.5);
      outline-offset: -2px;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #bfa571;
      border-radius: 3px;
    }

    .status-line {
      position: relative;
      padding-left: 2rem;
    }

    .status-line::before {
      content: '';
      position: absolute;
      left: 1rem;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(191, 165, 113, 0.3), transparent);
    }

    .status-header-line {
      height: 1px;
      background: linear-gradient(to right, transparent, #bfa571 20%, transparent);
      margin: 0.5rem 0 1.5rem 0;
      opacity: 0.6;
    }

    .text-golden {
      color: #bfa571;
    }

    /* Main Tab Session Table Styles */
    .session-table {
      width: 100%;
      border-collapse: collapse;
      background: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #333;
    }

    .session-table th {
      background: #252525;
      padding: 10px;
      text-align: center;
      border: 1px solid #333;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .session-table td {
      padding: 8px 12px;
      border: 1px solid #333;
      font-size: 0.9rem;
    }

    .player-row-current {
      background: #2b3539;
      color: #4cd1ff;
    }

    .hp-bar-container {
      width: 100%;
      background: #333;
      height: 24px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid #555;
    }

    .hp-bar-fill {
      background: #ff0000;
      height: 100%;
      width: 100%;
      transition: width 0.3s;
    }

    .hp-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
    }

    .action-btn {
      background: linear-gradient(to bottom, #7289da, #5865f2);
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.1s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .action-btn:hover {
      filter: brightness(1.1);
    }

    .action-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
