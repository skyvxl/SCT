name: CI
on:
  pull_request:
    branches:
      - main
  push:
    # Release branches are handled by release.yml, not this workflow
    branches-ignore:
      - 'release-*'
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Call the checks workflow in this repo
    uses: ./.github/workflows/checks.yml

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    # Wait for checks to pass before building
    needs: checks
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
      
      - name: Install dependencies
        run: uv sync --locked --dev
        
      - name: Get version
        # Note the PowerShell syntax for env vars
        run: echo "version=$(uv version --short)" >> $env:GITHUB_ENV
        
      - name: Build Windows
        run: uv run scripts/build.py
        
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantom-toolkit-windows
          # Windows exe and supporting files are under "dist/windows-$version/PhantomToolkit/".
          # We package the whole folder.
          path: dist/windows-${{ env.version }}

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    # Wait for Windows build because we need the exe
    needs: build-windows
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
      
      - name: Get version
        run: echo "version=$(uv version --short)" >> "$GITHUB_ENV"

      - name: Download Windows Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: phantom-toolkit-windows
          path: dist/windows-${{ env.version }}

      - name: Package as AppImage
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh
          
      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantom-toolkit-linux
          # Since Linux build is a single file, we just zip the file without a
          # containing folder.
          path: dist/linux-${{ env.version }}/PhantomToolkit.AppImage
