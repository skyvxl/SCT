# =============================================================================
# Phantom Toolkit - Automated Release Workflow
# =============================================================================

name: Create Release Draft

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Plan Release
  # ---------------------------------------------------------------------------
  plan:
    name: Plan Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current_version: ${{ steps.get-versions.outputs.current_version }}
      next_version: ${{ steps.get-versions.outputs.next_version }}
      version_no_v: ${{ steps.get-versions.outputs.version_no_v }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: taiki-e/install-action@9ca1734d8940023f074414ee621fd530c4ce10f2 # v2.55.3
        with:
          tool: git-cliff

      - name: Get current and next versions
        id: get-versions
        run: |
          # Get current version from pyproject.toml
          current_version=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          echo "current_version=v$current_version" >> "$GITHUB_OUTPUT"
          
          # Get next version from git-cliff (based on conventional commits)
          next_version=$(git cliff --bumped-version --unreleased)
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          
          # Also output version without 'v' prefix for artifact naming
          version_no_v="${next_version#v}"
          echo "version_no_v=$version_no_v" >> "$GITHUB_OUTPUT"
          
          echo "📌 Current version: v$current_version"
          echo "📌 Next version: $next_version"

  # ---------------------------------------------------------------------------
  # Job 2: Create Release Branch
  # ---------------------------------------------------------------------------
  create-release-branch:
    needs: plan
    name: Create Release Branch
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: needs.plan.outputs.current_version != needs.plan.outputs.next_version
    env:
      NEXT_VERSION: ${{ needs.plan.outputs.next_version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PUSH_TOKEN }}

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1

      - uses: taiki-e/install-action@9ca1734d8940023f074414ee621fd530c4ce10f2 # v2.55.3
        with:
          tool: git-cliff

      - name: Bump version and update changelog
        run: |
          # Bump version (removes 'v' prefix automatically in script if present, but we pass full tag)
          # sync_version.py expects X.Y.Z, so strip 'v'
          ver_clean="${NEXT_VERSION#v}"
          uv run scripts/sync_version.py --set "$ver_clean"
          
          # Update uv.lock if needed (version change in pyproject.toml)
          uv sync --dev
          
          # Update changelog
          if ! grep -q "^## Release $NEXT_VERSION" CHANGELOG.md 2>/dev/null; then
             # git-cliff needs to know the tag for the upcoming release to group commits correctly
            git cliff --tag "$NEXT_VERSION" -o CHANGELOG.md
          fi

      - name: Commit and push release branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions"
          git add pyproject.toml uv.lock CHANGELOG.md
          
          # Only commit if changes exist
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "chore(release): prepare $NEXT_VERSION"
          fi
          
          git push origin "HEAD:refs/heads/release-$NEXT_VERSION" --force

  # ---------------------------------------------------------------------------
  # Job 3: Build & Package
  # ---------------------------------------------------------------------------
  build-windows:
    needs: [plan, create-release-branch]
    name: Build Windows
    runs-on: windows-latest
    if: needs.plan.outputs.current_version != needs.plan.outputs.next_version
    env:
      VERSION_NO_V: ${{ needs.plan.outputs.version_no_v }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: release-${{ needs.plan.outputs.next_version }}

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
      
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build Windows
        run: uv run scripts/build.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantom-toolkit-windows
          path: dist/windows-${{ env.VERSION_NO_V }}

  build-linux-appimage:
    needs: [plan, create-release-branch, build-windows]
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    if: needs.plan.outputs.current_version != needs.plan.outputs.next_version
    env:
      VERSION_NO_V: ${{ needs.plan.outputs.version_no_v }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: release-${{ needs.plan.outputs.next_version }}
          
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1

      - name: Download Windows Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: phantom-toolkit-windows
          path: dist/windows-${{ env.VERSION_NO_V }}
          

      - name: Package as AppImage
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantom-toolkit-linux
          path: dist/linux-${{ env.VERSION_NO_V }}/PhantomToolkit.AppImage

  # ---------------------------------------------------------------------------
  # Job 4: Finalize Release
  # ---------------------------------------------------------------------------
  finalize-release:
    needs: [plan, create-release-branch, build-windows, build-linux-appimage]
    name: Finalize Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: needs.plan.outputs.current_version != needs.plan.outputs.next_version
    env:
      NEXT_VERSION: ${{ needs.plan.outputs.next_version }}
      GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: release-${{ needs.plan.outputs.next_version }}
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts/

      - name: Prepare artifacts
        run: |
          chmod +x scripts/prepare_artifacts.sh
          ./scripts/prepare_artifacts.sh "$NEXT_VERSION"

      - name: Extract changelog
        id: changelog
        run: |
          chmod +x scripts/extract_changelog.sh
          changelog=$(./scripts/extract_changelog.sh "$NEXT_VERSION")
          
          # Write to file for PR body
          echo "$changelog" > release_changelog.txt
          
          # Output for step
          {
            echo "content<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update Pull Request
        run: |
          changelog=$(cat release_changelog.txt)
          pr_title="🚀 Release: Phantom Toolkit $NEXT_VERSION"
          
          {
            echo "## 🚧 UNRELEASED"
            echo ""
            echo "**This release is still under development.**"
            echo "Changes in this PR will be included in the final release once merged."
            echo ""
            echo "---"
            echo ""
            echo "$changelog"
          } > pr_body.txt
          
          if gh pr create -B main --title "$pr_title" -b "$(cat pr_body.txt)" --head "release-$NEXT_VERSION" 2>/dev/null; then
            echo "✅ Created new PR"
          else
            echo "ℹ️  PR already exists, updating..."
            gh pr edit "release-$NEXT_VERSION" -b "$(cat pr_body.txt)"
          fi

      - name: Delete old release drafts
        uses: hugo19941994/delete-draft-releases@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        with:
          threshold: "1s"

      - name: Create draft release
        run: |
          chmod +x scripts/create_release.sh
          ./scripts/create_release.sh "$NEXT_VERSION" "${{ steps.changelog.outputs.content }}"
