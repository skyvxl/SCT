[symbols]
# AOB-only: provide only what we use.
# Convention:
# - *PtrAddr symbols should resolve to the ADDRESS that holds the pointer (so code can read_ptr()).
# - For RIP-relative mov/lea patterns, use kind="rip_relative".

[symbols.GameDataManPtrAddr]
pattern = "48 8B 05 ?? ?? ?? ?? 48 85 C0 74 05 48 8B 40 58 C3 C3"
offset = "0x0"
kind = "rip_relative"
module = "eldenring.exe"

[symbols.GameManPtrAddr]
pattern = "48 8B 05 ?? ?? ?? ?? 80 B8 ?? ?? ?? ?? 0D 0F 94 C0 C3"
offset = "0x0"
kind = "rip_relative"
module = "eldenring.exe"

[symbols.WorldChrManPtrAddr]
pattern = "48 8B 05 ?? ?? ?? ?? 48 85 C0 74 0F 48 39 88"
offset = "0x0"
kind = "rip_relative"
module = "eldenring.exe"

[symbols.EquipGearFunc]
pattern = "?? 8B F1 ?? 8B D8 ?? 63 EA ?? 8B F9"
offset = "-0x17"
kind = "absolute"
module = "eldenring.exe"

[symbols.EquipGoodsFunc]
pattern = "?? FA ?? ?? 0F ?? 81 C1 ?? ?? ?? ?? ?? 8B C1 E9"
offset = "0x0"
kind = "absolute"
module = "eldenring.exe"

[symbols.ItemGiveFunc]
pattern = "8B 02 83 F8 0A"
offset = "-0x52"
kind = "absolute"
module = "eldenring.exe"

[symbols.RemoveItemFunc]
pattern = "?? 83 EC ?? 8B F2 ?? 8B E9 ?? 85 C0 74"
offset = "-0x10"
kind = "absolute"
module = "eldenring.exe"

