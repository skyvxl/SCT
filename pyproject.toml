[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seamless-coop-toolkit"
version = "0.1.0.dev0"
description = "Windows toolkit for Elden Ring Seamless Co-op."
authors = [{ name = "skyvxl" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.10.2,<7", "pymem>=1.14.0,<2"]

[project.scripts]
sct = "sct.application:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["sct*"]

[tool.setuptools.package-data]
sct = [
    "resources/audios/*.wav",
    "resources/flags/*.png",
    "resources/icons/*",
    "resources/i18n/*.json",
    "resources/styles/*.qss",
    "game/elden_ring/*.toml",
]

[dependency-groups]
build = ["pyinstaller>=6.21,<7"]
dev = ["ruff>=0.15.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
